# ---------------------------------------------------------------------------
# Prefix: both C-b and C-a work. Press either twice to send it through.
# ---------------------------------------------------------------------------

set -g prefix C-b
unbind-key C-b
bind-key C-b send-prefix

set -g prefix2 C-a
unbind-key C-a
bind-key C-a send-prefix -2

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
#
# Gated on class rather than on a *_local file: ~/.tmux_local.conf is the
# per-machine escape hatch and stays reserved for that.
#
# tmux-256color knows about italics and 24-bit colour, but the terminfo entry
# is missing on older servers -- and screen-256color, the safe fallback, has no
# kLFT5/kRIT5 capabilities at all, which is what used to kill Ctrl+arrow word
# movement. 50-keybindings.zsh now binds the literal sequences instead, so both
# branches get working Ctrl+arrows either way.

if-shell '[ "$(cat ~/.config/dotfiles/class 2>/dev/null)" = rich ]' \
    'set -g default-terminal "tmux-256color" ; set -as terminal-features ",*:RGB"' \
    'set -g default-terminal "screen-256color"'

# Claude Code inside tmux needs two things it cannot get by default:
# extended keys, so Shift+Enter arrives as something other than a plain
# Enter (it inserts a newline instead of submitting), and passthrough, so
# its desktop notifications and progress reports reach the outer terminal
# instead of being swallowed here. The terminal emulator still has to send a
# distinct Shift+Enter of its own -- konsole needs a keytab entry for it.
#
# Rich only: extended-keys is tmux 3.2+, and base has to survive on whatever
# tmux an old box came with.
if-shell '[ "$(cat ~/.config/dotfiles/class 2>/dev/null)" = rich ]' \
    'set -s extended-keys on ; set -as terminal-features ",*:extkeys" ; set -g allow-passthrough on'

# ---------------------------------------------------------------------------
# Windows and panes
# ---------------------------------------------------------------------------

set -g base-index 1           # window numbers match the keyboard row
setw -g pane-base-index 1
set -g renumber-windows on    # close a window, the rest close up the gap
setw -g monitor-activity on
set -g history-limit 100000

# ---------------------------------------------------------------------------
# Mouse
# ---------------------------------------------------------------------------
#
# On: wheel scrolls into the scrollback, click selects a pane, dragging a
# border resizes it, and a drag copies into tmux's own buffer.
#
# The cost is either/or, not something to tune: with the mouse on, the
# terminal is told to report every button and drag to tmux, so the emulator
# cannot make a native selection. That yellow block is tmux's copy-mode
# selection -- it goes to a tmux buffer and, via set-clipboard/OSC 52, to the
# local CLIPBOARD (Ctrl+V), never to PRIMARY (middle-click).
#
# Two routes back to a classic middle-click selection: hold Shift while
# dragging, which bypasses tmux for that drag, or prefix-m to turn the mouse
# off entirely while doing a lot of it. prefix-m takes over the default "mark
# pane", which is still in the prefix-> pane menu. A full-screen program that
# grabs the mouse itself (Claude Code in fullscreen mode, vim with `set
# mouse=a`) takes it regardless of this setting -- Shift works there too.
set -g mouse on
bind m set -g mouse \; display -d 2000 \
    'mouse #{?mouse,on: Shift+drag selects natively,off: drag selects natively}'

# Copy-mode copies still reach the local clipboard over OSC 52 across SSH.
set -g set-clipboard on

# Scrollback without the prefix dance.
bind -n S-PageUp   copy-mode -u
bind -n S-PageDown send-keys -X page-down

# ---------------------------------------------------------------------------
# Status bar: per-window repo context
# ---------------------------------------------------------------------------
#
#   [host]  1:~  2:dotfiles:main+  3:api:feat/x  4*webapp:main      15:22
#
# Each window names itself after the repo and branch of its own current
# directory, so the bar is a project overview -- it tells you about the
# windows you are NOT looking at. '+' marks uncommitted changes, '*' the
# active window.
#
# Session name is deliberately not shown: with the grouped-session SSH model
# in 60-tmux-over-ssh.zsh, sessions are called things like "ssh-4171-9382".
# The hostname is the useful identifier.

set -g status-interval 10
set -g status-justify left
set -g status-bg '#666666'
set -g status-fg white

set -g status-left  '#[bold] [#h] '
set -g status-left-length 30
set -g status-right ' %H:%M '
set -g status-right-length 20

setw -g window-status-format         ' #I:#W '
setw -g window-status-current-format '#[reverse] #I*#W #[default]'
setw -g window-status-activity-style underscore

setw -g automatic-rename on
setw -g automatic-rename-format '#(~/.local/bin/tmux-window-label "#{pane_current_path}" "#{pane_id}")'

# A window created with an explicit name (`new-window -n foo`, as container
# tooling tends to do) has automatic-rename switched off for good, and then
# the format above never runs -- which is how every window ends up called
# "shell". Turn it back on for new windows; 60-tmux-over-ssh.zsh does the
# same for windows that already exist when a shell starts in them.
set-hook -g after-new-window   'setw automatic-rename on'
set-hook -g after-split-window 'setw automatic-rename on'

# ---------------------------------------------------------------------------
# Per-hostname overrides: ~/.config/tmux/host-<hostname>.conf, not tracked.
# The intended use is a per-machine status-bar colour, so you can tell at a
# glance which box a tmux is on. run-shell defers past config parsing, so
# this applies (and can override) anything in this file, including the
# escape hatch below.
# ---------------------------------------------------------------------------

run-shell 'f="$HOME/.config/tmux/host-$(hostname -s).conf"; [ -r "$f" ] && tmux source-file "$f"; true'

# ---------------------------------------------------------------------------
# Per-machine escape hatch -- last, so it can override anything above.
# ---------------------------------------------------------------------------

if-shell "[ -f ~/.tmux_local.conf ]" 'source ~/.tmux_local.conf'
